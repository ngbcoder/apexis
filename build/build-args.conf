# Apexis build arguments. Dotenv format, read by build/versionary.
#
# VERSION is the product version this build carries. Keep it in step with
# plan.md and the README status banner — the two drifting apart is exactly how a
# project starts lying about itself.

VERSION=0.1.0

# STREAM is required by coreos-assembler: it derives the yumrepo filename from
# it (src/yumrepos/${STREAM}.repo). No src/yumrepos/ directory exists, so the
# value is informational and cosa falls back to its default Fedora repos. Set
# it to a real name once Apexis has an actual stream taxonomy (plan.md §5).
STREAM=apexis

# NAME is required by coreos-assembler: it sets the OCI tag and OS identity
# (osname is taken from image.yaml, but cosa needs NAME for the tag).
NAME=apexis

# ID is informational; carried for traceability.
ID=apexis